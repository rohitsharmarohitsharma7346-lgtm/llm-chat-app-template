<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>NOVA AI 🤖</title>

	<style>
		:root {
			--primary-color: #f6821f;
			--primary-hover: #e67e22;
			--light-bg: #f9fafb;
			--border-color: #e5e7eb;
			--text-color: #1f2937;
			--text-light: #6b7280;
			--user-msg-bg: #fff2e6;
			--assistant-msg-bg: #f3f4f6;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
				Roboto, sans-serif;
			line-height: 1.6;
			color: var(--text-color);
			max-width: 800px;
			margin: 0 auto;
			padding: 1rem;
		}

		header {
			text-align: center;
			margin-bottom: 1rem;
			padding: 1rem 0;
			border-bottom: 1px solid var(--border-color);
		}

		h1 {
			font-size: 1.5rem;
			color: var(--primary-color);
		}

		.chat-container {
			display: flex;
			flex-direction: column;
			height: calc(100vh - 180px);
			min-height: 400px;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			overflow: hidden;
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 1rem;
			background-color: var(--light-bg);
		}

		.message {
			margin-bottom: 1rem;
			padding: 0.75rem;
			border-radius: 8px;
			max-width: 85%;
		}

		.message p {
			white-space: pre-line;
			margin: 0;
			overflow-wrap: anywhere;
		}

		.user-message {
			background-color: var(--user-msg-bg);
			margin-left: auto;
		}

		.assistant-message {
			background-color: var(--assistant-msg-bg);
		}

		.message-input {
			display: flex;
			gap: 0.5rem;
			padding: 0.75rem;
			border-top: 1px solid var(--border-color);
			background-color: white;
		}

		#user-input {
			flex: 1;
			padding: 0.75rem;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			font-family: inherit;
			resize: none;
			min-height: 44px;
		}

		button {
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-size: 1rem;
			min-width: 48px;
		}

		#mic-button {
			background-color: #333;
			color: white;
			padding: 0 0.8rem;
		}

		#mic-button.listening {
			background-color: #d32f2f;
		}

		#send-button {
			padding: 0 1rem;
			background-color: var(--primary-color);
			color: white;
		}

		button:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		.typing-indicator {
			display: none;
			font-style: italic;
			color: var(--text-light);
			padding: 1rem;
		}

		.typing-indicator.visible {
			display: block;
		}

		footer {
			margin-top: 1rem;
			text-align: center;
			font-size: 0.85rem;
			color: var(--text-light);
		}
	</style>
</head>

<body>
	<header>
		<h1>NOVA AI 🤖</h1>
		<p>Sachin ka personal AI assistant</p>
	</header>

	<div class="chat-container">

		<div id="chat-messages" class="chat-messages">
			<div class="message assistant-message">
				<p>Hello! Main Nova hoon 🤖 — Sachin ka banaya hua personal AI assistant. 😎🔥</p>
			</div>
		</div>

		<div class="typing-indicator" id="typing-indicator">
			Nova soch raha hai... 🤔
		</div>

		<div class="message-input">
			<textarea
				id="user-input"
				placeholder="Nova se baat karo..."
				rows="1"
				autofocus
			></textarea>

			<button id="mic-button" type="button" title="Voice input">
				🎤
			</button>

			<button id="send-button" type="button">
				Send
			</button>
		</div>
	</div>

	<footer>
		<p>NOVA AI 🤖 • Sachin ka personal AI assistant</p>
	</footer>

	<script src="chat.js"></script>
</body>
</html>
