<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NOVA AI 🤖</title>

	<style>
		:root {
			--primary: #f6821f;
			--primary-hover: #e67e22;
			--bg: #f9fafb;
			--border: #e5e7eb;
			--text: #1f2937;
			--user: #fff2e6;
			--assistant: #f3f4f6;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: Arial, sans-serif;
			color: var(--text);
			max-width: 800px;
			margin: auto;
			padding: 16px;
		}

		header {
			text-align: center;
			padding: 16px 0;
			margin-bottom: 16px;
			border-bottom: 1px solid var(--border);
		}

		h1 {
			color: var(--primary);
			font-size: 24px;
		}

		.chat-container {
			height: calc(100vh - 170px);
			min-height: 400px;
			display: flex;
			flex-direction: column;
			border: 1px solid var(--border);
			border-radius: 10px;
			overflow: hidden;
		}

		#chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 16px;
			background: var(--bg);
		}

		.message {
			max-width: 85%;
			margin-bottom: 12px;
			padding: 12px;
			border-radius: 10px;
		}

		.message p {
			margin: 0;
			white-space: pre-line;
			overflow-wrap: anywhere;
		}

		.user-message {
			background: var(--user);
			margin-left: auto;
		}

		.assistant-message {
			background: var(--assistant);
			margin-right: auto;
		}

		.typing-indicator {
			display: none;
			padding: 10px 16px;
			color: #6b7280;
			font-style: italic;
		}

		.typing-indicator.visible {
			display: block;
		}

		.message-input {
			display: flex;
			gap: 8px;
			padding: 10px;
			background: white;
			border-top: 1px solid var(--border);
		}

		#user-input {
			flex: 1;
			min-height: 44px;
			max-height: 140px;
			padding: 11px;
			border: 1px solid var(--border);
			border-radius: 8px;
			font-family: inherit;
			font-size: 16px;
			resize: none;
			outline: none;
		}

		button {
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
			min-height: 44px;
		}

		#mic-button {
			width: 48px;
			background: #333;
			color: white;
		}

		#mic-button.listening {
			background: #d32f2f;
		}

		#send-button {
			padding: 0 16px;
			background: var(--primary);
			color: white;
		}

		button:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		footer {
			text-align: center;
			padding-top: 12px;
			color: #6b7280;
			font-size: 13px;
		}
	</style>
</head>

<body>

	<header>
		<h1>NOVA AI 🤖</h1>
		<p>Sachin ka personal AI assistant</p>
	</header>

	<div class="chat-container">

		<div id="chat-messages">

			<div class="message assistant-message">
				<p>Hello! Main Nova hoon 🤖 — Sachin ka banaya hua personal AI assistant. 😎🔥</p>
			</div>

		</div>

		<div id="typing-indicator" class="typing-indicator">
			Nova soch raha hai... 🤔
		</div>

		<div class="message-input">

			<textarea
				id="user-input"
				placeholder="Nova se baat karo..."
				rows="1"
				autofocus
			></textarea>

			<button
				id="mic-button"
				type="button"
				title="Voice input"
			>🎤</button>

			<button
	id="voice-button"
	type="button"
	title="Nova voice ON/OFF"
>🔊</button>

			<button
				id="send-button"
				type="button"
			>Send</button>

		</div>

	</div>

	<footer>
		NOVA AI 🤖 • Sachin ka personal AI assistant
	</footer>

	<script src="chat.js"></script>

</body>
</html>
